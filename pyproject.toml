[project]
name = "song-cloner"
version = "0.1.0"
description = "Personal tool: re-voice the lead vocal of a song with an RVC voice model."
readme = "README.md"
requires-python = ">=3.12,<3.14"
dependencies = [
    "typer>=0.12",
    "huggingface-hub>=0.25",
    "requests>=2.31",
]

[project.optional-dependencies]
# The heavy part (PyTorch, separation and RVC models). Kept optional so that
# linting and unit tests do not need several gigabytes of wheels.
engine = ["ultimate-rvc==0.6.0"]
dev = ["pytest>=8", "ruff>=0.8"]

[project.scripts]
songcloner = "songcloner.cli:app"

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/songcloner"]

[tool.pytest.ini_options]
testpaths = ["tests"]

[tool.ruff]
line-length = 100
target-version = "py312"
# The Colab notebook is written for readers, with shell magics and aligned comments.
extend-exclude = ["notebooks"]

[tool.ruff.lint]
select = ["E", "F", "I", "B", "UP"]
